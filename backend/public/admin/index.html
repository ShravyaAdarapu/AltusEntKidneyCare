<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Altus · Clinic desk</title><link rel="stylesheet" href="../assets/css/style.css"><style>body{padding:24px;background:#f7f0e5}main{max-width:1100px;margin:auto}header{display:flex;justify-content:space-between;align-items:center}section{padding:20px;background:#fffaf4;border:1px solid #ddc6b0;border-radius:16px;margin:16px 0}input,select,button{font:inherit;padding:9px;border:1px solid #bba28e;border-radius:8px}button{cursor:pointer;background:#5c3d26;color:white}button:disabled{opacity:.5}label{display:inline-grid;gap:4px;margin:6px}article{padding:14px 0;border-bottom:1px solid #eadccf}p{margin:6px 0;white-space:pre-wrap}#notice{position:sticky;top:0;background:#f7f0e5;padding:10px;z-index:3}form.week{display:flex;flex-wrap:wrap;gap:4px}.day{display:flex;align-items:center;gap:6px;width:100%;flex-wrap:wrap}.day label{min-width:110px}h1{font-size:1.8rem}h2{font-size:1.3rem}#login{max-width:440px}#login label{display:grid}article button{margin:4px}a{margin:6px}</style></head><body><main><header><h1>Altus clinic desk</h1><button id="logout" hidden>Sign out</button></header><p id="notice" role="status"></p><section id="login"><h2>Staff sign in</h2><form id="loginForm"><label>Username<input name="username" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button>Sign in</button></form></section><div id="desk" hidden><section><h2>Appointments</h2><label>Visit date<input id="date" type="date"></label><label>Doctor<select id="doctorFilter"><option value="">Both doctors</option></select></label><button id="refresh">Refresh</button><div id="appointments"></div></section><section><h2>Enquiries</h2><div id="enquiries"></div></section><section><h2>Doctor availability</h2><p>All times are India time. Changes affect new bookings; contact patients separately about existing appointments.</p><div id="hours"></div><h2>Close or reopen a date</h2><form id="closure"><label>Doctor<select name="doctor"></select></label><label>Date<input name="date" type="date" required></label><label>Availability<select name="closed"><option value="true">Closed</option><option value="false">Open as scheduled</option></select></label><button>Save date</button></form><div id="closures"></div></section></div></main><script src="admin.js"></script></body></html>
